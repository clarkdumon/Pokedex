<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PTO Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      outline: 1px dotted red;
    }
    body {
      margin: 0;
      display: flex;
      height: 100vh;
    }
    .sidebar {
      width: 200px;
      background-color: #2c2f36;
      color: white;
      padding: 20px;
    }
    .sidebar h2 {
      font-size: 20px;
      margin-bottom: 30px;
    }
    .sidebar a {
      display: block;
      color: white;
      text-decoration: none;
      margin: 10px 0;
    }
    .main {
      flex: 1;
      padding: 20px;
      background-color: #f4f4f4;
    }
    .top-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 20px;
    }
    .btn {
      background-color: #3b82f6;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 5px;
      cursor: pointer;
    }
    .table-container {
      background: white;
      padding: 20px;
      border-radius: 8px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 12px;
      border: 1px solid #ddd;
      text-align: left;
    }
    th {
      background-color: #f0f0f0;
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <h2>Dashboard</h2>
    <a href="#">Dashboard</a>
    <a href="#">Allocation</a>
  </div>

  <div class="main">
    <div class="top-bar">
      <button class="btn" onclick="requestPTO()">Request PTO</button>
    </div>
    <div class="table-container">
      <h3>Requested PTO</h3>
      <table>
        <thead>
          <tr>
            <th>Type</th>
            <th>Start Date</th>
            <th>End Date</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="pto-table-body">
          <tr>
            <td>Vacation</td>
            <td>03/10/2024</td>
            <td>03/14/2024</td>
            <td>Approved</td>
          </tr>
          <tr>
            <td>Sick</td>
            <td>03/25/2024</td>
            <td>03/26/2024</td>
            <td>Approved</td>
          </tr>
          <tr>
            <td>Sick</td>
            <td>04/10/2024</td>
            <td>04/12/2024</td>
            <td>Pending</td>
          </tr>
          <tr>
            <td>Vacation</td>
            <td>04/22/2024</td>
            <td>04/23/2024</td>
            <td>Rejected</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    function requestPTO() {
      alert("Request PTO functionality coming soon!");
    }
  </script>

</body>
</html>
